name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using: $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          if [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            SUB=$(dirname "$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$SUB" >> $GITHUB_ENV
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDeck-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
